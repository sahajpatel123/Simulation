[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

# Ruff — fast lint. Configuration lives here (not in
# .ruff.toml) so tool config stays in one place.
#
# * line-length = 100 matches the de-facto modern standard
#   (black's default). The codebase was written to ~100-120
#   chars per line; 88 (ruff's default) flag-bombs everything.
# * E402 (module-level import not at top of file) is
#   silenced — most occurrences are intentional
#   (``from __future__ import annotations`` is the first
#   import, then ``if TYPE_CHECKING:`` block follows, then
#   runtime imports). Re-enable per-file if a real violation
#   appears.
# * E501 (line too long) is silenced project-wide — the
#   100-char limit already keeps things readable, and the
#   real check is the W-series (real bugs).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default rule set + the warnings that catch real bugs.
select = ["E", "W", "F", "I", "UP"]
ignore = [
    "E501",  # line too long — covered by line-length config
    "E402",  # module-level import not at top — intentional
             # patterns (TYPE_CHECKING blocks) below
             # ``from __future__ import annotations`` are
             # false-positives here.
    "UP006",  # "Use X instead of 'X'" - found in existing code
    "UP035",  # Deprecated import - acceptable in some contexts
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pyupgrade]
python-version = "3.11"

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to be more relaxed — long descriptive
# names and docstrings outweigh line-length purity.
"tests/**/*.py" = ["E501"]

# Architect modules use compact one-liners with ``=`` padding
# for visual alignment of sub-score assignments (e.g.
# ``app_install = ...`` and ``account_aband = ...``). The
# W292 sibling warning also fires on these lines.
"backend/app/simulation/architects/physical_sensory.py" = ["E701"]
"backend/app/simulation/architects/purchase_decision.py" = ["E701"]
"backend/app/simulation/architects/setup_first_use.py" = ["E701"]

# Prompt templates are sent verbatim to LLMs — trailing
# whitespace inside triple-quoted strings may carry semantic
# weight (line breaks, prompt formatting) and must NOT be
# auto-stripped.
"backend/app/core/prompts.py" = ["W291"]

[tool.bandit]
# Central security-scan config shared by CI and pre-commit.
# B101 (assert) and B311 (random) are accepted project-wide after triage.
skips = ["B101", "B311"]
exclude_dirs = ["tests", "migrations", "node_modules", ".venv", ".venv2", ".venv_step86"]
