# Gitleaks configuration for TheCee
# https://github.com/gitleaks/gitleaks

title = "TheCee Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "thecee-generic-secret"
description = "Generic Secret"
regex = '''(?i)(password|passwd|pwd)\s*[=:]\s*['\"][^'\"]{4,}['\"]'''
tags = ["generic", "password"]
entropy = 0

[[rules]]
id = "thecee-aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(AKIA[0-9A-Z]{16})'''
tags = ["aws"]
entropy = 0

[[rules]]
id = "thecee-aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?:AWS_ACCESS_KEY_ID|aws_secret_access_key|secret_key).*['\"][A-Za-z0-9/+=]{40}['\"]'''
tags = ["aws"]
entropy = 0

[[rules]]
id = "thecee-generic-api-key"
description = "Generic API Key Pattern"
regex = '''(?i)api[_-]?key\s*[=:]\s*['\"][a-z0-9_-]{16,}['\"]'''
tags = ["generic", "api"]
entropy = 4

[[rules]]
id = "thecee-jwt-secret"
description = "JWT Secret"
regex = '''(?i)secret[_-]?key\s*[=:]\s*['\"][^'\"]{16,}['\"]'''
tags = ["generic", "jwt"]
entropy = 4

[allowlist]
# Allowlist for test files that intentionally contain dummy secrets
paths = [
    '''requirements.txt''',  # Has no secrets
    '''test.*\.py$''',        # Test files with mock data
    '''\.pydevproject$''',  # Python dev config
    # Next.js generated build artifacts (encryption/preview signing keys are
    # local build-time values, not project secrets). The build dir itself is
    # gitignored; this suppresses historical false positives from commits that
    # predate the ignore rule.
    '''\.next\.nosync/.*''',
    # Share-token schema example is a documented placeholder, not a live token.
    '''backend/app/schemas/share\.py$''',
]
stopwords = [
    "sk-test-placeholder",  # Test placeholder in CI
    "ci-secret-key-not-used",  # CI secret placeholder
    "dev-secret-change-in-prod",  # Weak secret detection false positive
    # Leaked NVIDIA API key committed in .openclaude-profile.json, then deleted
    # and gitignored. The key has been revoked at the NVIDIA API portal. This
    # stopword suppresses residual findings in git history scans so CI stays
    # green; the key is inert (rotated) and must NOT be re-used.
    "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",
]
# Commits where .openclaude-profile.json (containing a real nvapi- key) was
# temporarily present before being deleted in commit 3a5d2edab. These SHAs are
# suppressed so full-history gitleaks scans (secret-scan workflow) do not flag
# the historical commit. After a future history rewrite these SHAs should be
# removed from the allowlist (and the key confirmed gone from all refs).
commits = [
    "3a5d2edab275eee1b03ee33bd96496e52fa41d44",
    "bf0c40b5a2b4a5bf07bea324a11d15289846a1b2",
]
