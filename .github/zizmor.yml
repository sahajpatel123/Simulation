rules:
  # Pinning policy, enforced by tools/validate_ci.py: first-party actions
  # (actions/*, github/codeql-action) ride full version tags; community
  # third-party actions must be SHA-pinned. That's stricter than tags-only
  # but not the blanket hash-everywhere policy zizmor wants, so disable its
  # unpinned-uses audit here while still catching the other workflow-
  # security classes.
  unpinned-uses:
    disable: true
