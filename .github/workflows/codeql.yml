name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Elevated permissions live at job scope, not workflow scope, so a
    # modified future step can't inherit SARIF upload rights silently.
    permissions:
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # security-and-quality covers the full default security suite plus
          # maintainability/correctness queries for both Python and JavaScript.
          queries: security-and-quality
          # Model pack teaching CodeQL that app.core.security.log_safe()
          # strips CR/LF, making its return value a log-injection barrier.
          # Spec format is `scope/name:path` (see codeql-action
          # src/config/db-config.ts): the name comes from qlpack.yml, the
          # path points at the in-repo pack and must already be normalized
          # (no leading `./`). The expression keeps the javascript matrix
          # leg at an empty input; a rejected pack fails init loudly
          # instead of silently scanning without the models.
          packs: "${{ matrix.language == 'python' && 'thecee/python-security-models:codeql-custom-queries-python' || '' }}"

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:${{ matrix.language }}'
