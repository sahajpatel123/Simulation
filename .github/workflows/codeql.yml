name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Elevated permissions live at job scope, not workflow scope, so a
    # modified future step can't inherit SARIF upload rights silently.
    permissions:
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # security-and-quality covers the full default security suite plus
          # maintainability/correctness queries for both Python and JavaScript.
          #
          # NOTE: the in-repo model pack (codeql-custom-queries-python/, which
          # teaches CodeQL that app.core.security.log_safe() strips CR/LF) is
          # deliberately NOT wired here yet. The `packs:` input resolves
          # `scope/name[@version][:path]` specs exclusively from the GitHub
          # Container registry — `:path` selects queries WITHIN a published
          # pack and cannot point at a local directory (confirmed against
          # codeql-action v4.37.7 src/config/db-config.ts, its packaging
          # PR-checks, and the GitHub docs). Wiring options for unpublished
          # in-repo extension packs need proof before going live; until then
          # the 17 py/log-injection alerts stay open rather than risk a
          # broken scan.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:${{ matrix.language }}'
