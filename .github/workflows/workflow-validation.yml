name: Workflow Validation

# Validates GitHub Actions workflows syntax on every PR
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/gitleaks.toml'
      - '.github/ISSUE_TEMPLATE/security_report.md'
      - 'SECURITY.md'
      - 'tools/validate_ci.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          expected_sha256="3e6e0a832dfa0b5f027e6b8956aad2632d69b7cb778b1cff847b40279950a856"
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.5/actionlint_1.7.5_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          echo "${expected_sha256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: Validate workflows
        run: |
          ./actionlint -verbose
          echo "✅ All workflows are valid"

  validate-ci-hygiene:
    name: Validate CI hygiene (local parity script)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run CI hygiene checks
        run: |
          python tools/validate_ci.py

  validate-zizmor:
    name: Validate workflows with zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install zizmor
        run: pip install --quiet zizmor==1.28.0

      - name: Run zizmor
        run: zizmor --config .github/zizmor.yml .github/workflows
