name: Workflow Validation

# Validates GitHub Actions workflows syntax on every PR
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install actionlint
        id: get_actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.5
          echo "executable=$PWD/actionlint" >> "$GITHUB_OUTPUT"

      - name: Validate workflows
        run: |
          "${{ steps.get_actionlint.outputs.executable }}" -verbose
          echo "✅ All workflows are valid"

  validate-yaml:
    name: Validate YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate YAML files
        run: |
          find .github -name '*.yml' -o -name '*.yaml' | while read f; do
            echo "Validating $f"
            python -c "import yaml; yaml.safe_load(open('$f'))"
          done
          echo "✅ All YAML files are valid"

  validate-toml:
    name: Validate TOML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate TOML files
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          echo "✅ TOML files are valid"

  security-policy-check:
    name: Security policy validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate security policy exists
        run: |
          if [ -f "SECURITY.md" ]; then
            echo "✅ SECURITY.md exists"
          else
            echo "⚠️ SECURITY.md not found"
          fi

      - name: Check for security issue template
        run: |
          if [ -f ".github/ISSUE_TEMPLATE/security_report.md" ]; then
            echo "✅ Security issue template exists"
          else
            echo "⚠️ Security issue template not found"
          fi

      - name: Validate dependabot configuration
        run: |
          if [ -f ".github/dependabot.yml" ]; then
            python -c "import yaml; yaml.safe_load(open('.github/dependabot.yml'))"
            echo "✅ dependabot.yml is valid"
          else
            echo "⚠️ dependabot.yml not found"
          fi
