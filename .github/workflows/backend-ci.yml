name: backend-ci

on:
  push:
    branches:
      - main
      - "autonomous/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    # The suite has grown past the old 15-minute cap; 30 keeps a real
    # failure visible without letting a hung run burn unlimited runner time.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thecee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thecee_test
      GROK_API_KEY: sk-test-placeholder
      SECRET_KEY: ci-secret-key-not-used
      FRONTEND_URL: http://localhost:3000
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # Every install pins an exact version — unpinned installs are a
          # supply-chain hole (scorecard PinnedDependencies) and make CI
          # non-reproducible. Dependabot's pip ecosystem keeps the
          # requirements.txt pins fresh weekly.
          python -m pip install --quiet "pip==25.2"
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir "pytest==9.1.1" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0"

      - name: Check for secrets in codebase
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 1
          done
          echo "Database did not become ready in time"
          exit 1

      - name: Run database migrations
        run: |
          # --migrate-only applies the schema and exits; without it the
          # script starts uvicorn and this step would hang until the
          # job timeout cancels the run before pytest ever executes.
          python migrate_and_start.py --migrate-only

      - name: Run pytest with coverage
        run: |
          # term-missing keeps the human-readable table in the log; xml is what
          # the upload step below packages (it errors on missing files).
          pytest tests/ -v --maxfail=5 --tb=short --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=0

      - name: Upload test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-coverage-report
          path: |
            .coverage
            coverage.xml
          retention-days: 7
          if-no-files-found: error
