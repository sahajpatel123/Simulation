name: lint

# Fast Python lint (ruff) — runs BEFORE pytest in CI order
# doesn't actually matter because they run in parallel jobs,
# but the per-PR feedback comes back in ~10s instead of
# ~70s+ for pytest. Catches syntax errors, undefined names,
# unused imports at the module level so we don't waste the
# full test cycle on a typo.

on:
  push:
    branches: [main, "autonomous/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Run ruff check
        # Rule selection lives in pyproject.toml — the workflow
        # just runs ``ruff check`` and reports what the config
        # says to flag.
        run: |
          ruff check backend/app

      - name: Run ruff format check
        run: |
          ruff format --check backend/app

  python-deps-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install security tools
        run: |
          pip install --quiet pip-audit==2.7.2 safety==2.3.5 bandit==1.7.10

      - name: Audit requirements.txt for CVEs
        id: pip-audit
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output pip-audit-report.json
          audit_exit=$?
          set -e
          echo "audit_exit=$audit_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify pip-audit produced a report
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open('pip-audit-report.json') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'::error::pip-audit report is not valid JSON: {e}')
              sys.exit(1)
          if not isinstance(data, list):
              print('::error::pip-audit report is not a list')
              sys.exit(1)
          print('✅ pip-audit report is valid JSON')
          PY

      - name: Safety check for known vulnerabilities
        id: safety
        run: |
          set +e
          safety check -r requirements.txt --output json > safety-report.json
          safety_exit=$?
          set -e
          echo "safety_exit=$safety_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify safety produced a report
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open('safety-report.json') as f:
                  json.load(f)
          except Exception as e:
              print(f'::error::safety report is not valid JSON: {e}')
              sys.exit(1)
          print('✅ safety report is valid JSON')
          PY

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: dependency-audit-reports
          path: |
            pip-audit-report.json
            safety-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Summarise findings
        if: always()
        run: |
          if [ -f pip-audit-report.json ]; then
            python -c "
          import json, sys
          try:
              with open('pip-audit-report.json') as f:
                  data = json.load(f)
              vulns = len(data) if isinstance(data, list) else 0
              print(f'::notice title=pip-audit:: {vulns} known vulnerabilities found in requirements.txt')
          except Exception as e:
              print(f'Summary failed: {e}', file=sys.stderr)
          "
          fi
