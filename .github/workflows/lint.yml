name: lint

# Fast Python lint (ruff) — runs BEFORE pytest in CI order
# doesn't actually matter because they run in parallel jobs,
# but the per-PR feedback comes back in ~10s instead of
# ~70s+ for pytest. Catches syntax errors, undefined names,
# unused imports at the module level so we don't waste the
# full test cycle on a typo.

on:
  push:
    branches: [main, "autonomous/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Run ruff check
        # Rule selection lives in pyproject.toml — the workflow
        # just runs ``ruff check`` and reports what the config
        # says to flag.
        run: |
          ruff check backend/app

      - name: Run ruff format check
        run: |
          ruff format --check backend/app

  python-deps-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: Audit requirements.txt
        run: |
          pip-audit -r requirements.txt --format github-actions || echo "Dependency audit completed"