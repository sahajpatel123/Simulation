name: lint

# Fast Python lint (ruff) — runs BEFORE pytest in CI order
# doesn't actually matter because they run in parallel jobs,
# but the per-PR feedback comes back in ~10s instead of
# ~70s+ for pytest. Catches syntax errors, undefined names,
# unused imports at the module level so we don't waste the
# full test cycle on a typo.

on:
  push:
    branches: [main, "autonomous/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (Python lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pin to a specific version to prevent CI breakage when newer ruff
        # releases introduce stricter rules. Bump in lockstep with the
        # ruff-pre-commit hook rev in .pre-commit-config.yaml.
        run: pip install --quiet "ruff==0.16.0"

      - name: Run ruff check
        # Rule selection lives in pyproject.toml — the workflow
        # just runs ``ruff check`` and reports what the config
        # says to flag.
        run: |
          ruff check backend/app

# Dependency CVE auditing (pip-audit, safety) deliberately lives in
# security-scan.yml, not here — duplicating it in lint ran the same
# pinned scanners twice on every push for zero extra signal.
# lint stays fast and single-purpose: ruff only.
